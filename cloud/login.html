<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>云端控制台登录</title><style>body{font-family:system-ui;max-width:420px;margin:8vh auto;padding:24px;background:#f5f7fa;color:#172b4d}label{display:block;margin:16px 0}input,button{box-sizing:border-box;width:100%;padding:12px;font:inherit}button{cursor:pointer}#message{white-space:pre-wrap}details{margin-top:24px}form{background:white;padding:24px;border-radius:12px}</style><script src="/login.js" defer></script></head><body><h1>云端控制台</h1><form id="loginForm"><h2>登录</h2><label>用户名<input name="username" autocomplete="username" maxlength="64" required></label><label>密码<input name="password" type="password" autocomplete="current-password" maxlength="256" required></label><button>登录</button></form><details id="registration"><summary>注册账号（需要邀请码）</summary><form id="registerForm"><label>用户名<input name="username" autocomplete="username" maxlength="64" required></label><label>密码（至少12个字符）<input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="256" required></label><label>邀请码<input name="invite" type="password" autocomplete="off" maxlength="256" required></label><button>注册</button></form></details><p id="message" role="status"></p></body></html>
