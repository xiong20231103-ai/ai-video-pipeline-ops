<!doctype html><html lang="zh-CN" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>登录 · 自动剪辑云端控制台</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/login.css"><script src="/login.js" type="module"></script></head><body><main><header><a class="brand" href="/login"><span aria-hidden="true">▦</span> 自动剪辑 <small>WORKSPACE / V2</small></a><button id="themeToggle" type="button" aria-label="切换到浅色主题">切换外观</button></header><section class="welcome"><p class="eyebrow">YOUR WORKSPACE</p><h1>回到你的控制台</h1><p>任务、进度与每一次创作，在这里连接。</p></section><section class="card" aria-label="账号登录与注册"><form id="loginForm"><h2>登录</h2><p class="muted">使用你的云端控制台账号。</p><label>用户名<input name="username" autocomplete="username" maxlength="64" required></label><label>密码<input name="password" type="password" autocomplete="current-password" maxlength="256" required></label><button class="primary">登录</button></form><details id="registration" hidden><summary>注册账号（需要邀请码）</summary><form id="registerForm"><h2>创建账号</h2><label>用户名<input name="username" autocomplete="username" maxlength="64" required></label><label>密码（至少12个字符）<input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="256" required></label><label>邀请码<input name="invite" type="password" autocomplete="off" maxlength="256" required></label><button class="primary">注册</button></form></details><p id="message" role="status" aria-live="polite"></p></section><footer>通过 Tailscale 安全连接 · 请勿分享账号凭据</footer></main></body></html>
