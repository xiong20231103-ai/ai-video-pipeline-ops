name: Isolated OPS tests
on:
  pull_request:
  push:
    branches: ["codex/**"]
permissions:
  contents: read
jobs:
  isolated-ops:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install isolated dependencies
        run: python -m pip install --target .test-deps -r requirements.txt -r cloud/requirements-test.txt
      - name: Run with production I/O blocked
        run: python -B tools/run_isolated_tests.py
      - name: Check cloud JavaScript syntax
        run: |
          node --check cloud/readonly.js
          node --check cloud/login.js
      - name: Check deployment shell syntax without executing it
        shell: bash
        run: |
          bash -n deploy/m1a-stage.sh
          bash -n deploy/m1a-activate.sh
          bash -n deploy/m1a-upgrade.sh
      - name: Validate Windows agent task without registering it
        shell: powershell
        run: |
          ./tests/test_agent_task.ps1
          ./tests/test_agent_migration.ps1
          ./tests/test_agent_acceptance.ps1
      - name: Real Windows job lifecycle with synthetic services and no home HTTP
        shell: powershell
        run: |
          $env:OPS_AGENT_TEST_PYTHON=(Get-Command python).Source
          python -B tests/agent_job_integration.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -B tests/agent_supervisor_integration.py
