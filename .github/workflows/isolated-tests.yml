name: Isolated OPS tests
on:
  pull_request:
  push:
    branches: ["codex/**"]
permissions:
  contents: read
jobs:
  isolated-ops:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install isolated dependencies
        run: python -m pip install --target .test-deps -r requirements.txt -r cloud/requirements-test.txt
      - name: Run with production I/O blocked
        run: python -B tools/run_isolated_tests.py
      - name: Check cloud JavaScript syntax
        run: |
          node --check cloud/readonly.js
          node --check cloud/login.js
          node --check cloud/backups.js
          node --check cloud/commands.js
          node --check cloud/cleanup.js
          node --check tests/cleanup_ui_fixture.cjs
          node --check static/app.js
          node --check tests/command_ui_fixture.cjs
      - name: Headless cloud command UI with all network intercepted
        shell: powershell
        run: |
          $deps=Join-Path $env:RUNNER_TEMP 'ops-ui-deps'
          npm install --prefix $deps --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org playwright@1.62.1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:OPS_UI_PLAYWRIGHT=Join-Path $deps 'node_modules/playwright'
          $edge='C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
          if (-not (Test-Path -LiteralPath $edge)) { $edge='C:\Program Files\Microsoft\Edge\Application\msedge.exe' }
          $env:OPS_UI_BROWSER_PATH=$edge
          node tests/cleanup_ui_fixture.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node tests/command_ui_fixture.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Check deployment shell syntax without executing it
        shell: bash
        run: |
          bash -n deploy/m1a-stage.sh
          bash -n deploy/m1a-activate.sh
          bash -n deploy/m1a-upgrade.sh
          bash -n deploy/m1b-repair-sources.sh
          bash -n deploy/m1b-upgrade.sh
          bash -n deploy/m2a-upgrade.sh
          bash -n deploy/m2b-upgrade.sh
      - name: Actual encrypted synthetic snapshots and inert restore
        shell: powershell
        run: |
          $env:PYTHONPATH="$PWD\.test-deps"
          python -B -m unittest discover -s tests -p backup_crypto_integration.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -B -m unittest discover -s tests -p backup_restore_integration.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -B -m unittest discover -s tests -p notification_backup_integration.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Validate Windows agent task without registering it
        shell: powershell
        run: |
          ./tests/test_agent_task.ps1
          ./tests/test_agent_migration.ps1
          ./tests/test_agent_acceptance.ps1
          ./tests/test_state_files.ps1
          ./tests/test_hidden_updater.ps1
          ./tests/test_m2a_deploy.ps1
          ./tests/test_shadow_launch.ps1
          ./tests/test_shadow_preflight_replace.ps1
      - name: Real loopback command HTTP with durable fixture databases
        run: python -B tests/command_transport_integration.py
      - name: Real Windows PowerShell 5.1 shadow launcher processes
        shell: powershell
        run: |
          $env:PYTHONPATH="$PWD\.test-deps"
          python -B tests/shadow_launcher_process_integration.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Real Windows job lifecycle with synthetic services and no home HTTP
        shell: powershell
        run: |
          $env:OPS_AGENT_TEST_PYTHON=(Get-Command python).Source
          python -B tests/agent_job_integration.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -B tests/agent_supervisor_integration.py
