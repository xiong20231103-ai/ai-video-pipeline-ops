name: Material handoff regression
on:
  pull_request:
    paths:
      - 'cloud/**'
      - 'tests/test_material_handoff.py'
      - 'tests/material_handoff_ui.test.cjs'
      - 'tools/run_material_handoff_tests.py'
      - 'tools/run_isolated_tests.py'
      - '.github/workflows/material-handoff.yml'
permissions:
  contents: read
jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r cloud/requirements-test.txt
      - run: python -B tools/run_material_handoff_tests.py
      - run: node --test tests/material_handoff_ui.test.cjs
